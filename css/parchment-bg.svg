<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!--
    7th Sea 1e parchment texture.
    Warm cream base with multi-layer turbulence for natural mottling.
    Tiles seamlessly when 'patternUnits' is userSpaceOnUse.
  -->
  <defs>
    <!-- Coarse stain blotches -->
    <filter id="stain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7"/>
      <feColorMatrix values="
         0 0 0 0  0.85
         0 0 0 0  0.71
         0 0 0 0  0.46
         0 0 0 0.7  0"/>
    </filter>

    <!-- Fine fiber grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="3"/>
      <feColorMatrix values="
         0 0 0 0  0.55
         0 0 0 0  0.38
         0 0 0 0  0.20
         0 0 0 0.12  0"/>
    </filter>

    <!-- Mid-scale mottle -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="11"/>
      <feColorMatrix values="
         0 0 0 0  0.65
         0 0 0 0  0.48
         0 0 0 0  0.26
         0 0 0 0.20  0"/>
    </filter>

    <!-- Edge vignette to deepen corners -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#a87d3e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3a14" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <!-- Base parchment cream -->
  <rect width="600" height="600" fill="#e9d5a6"/>

  <!-- Stain layer -->
  <rect width="600" height="600" filter="url(#stain)"/>

  <!-- Mottle layer -->
  <rect width="600" height="600" filter="url(#mottle)"/>

  <!-- Fiber grain -->
  <rect width="600" height="600" filter="url(#grain)"/>

  <!-- Vignette -->
  <rect width="600" height="600" fill="url(#vignette)"/>
</svg>
